<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tokenomics</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.04);
  --accent: #2a78d6;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #4a3aa7;
  --series-8: #e34948;
  --series-other: #b5b3ab;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-serious: #ec835a;
  --status-critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.05);
    --accent: #3987e5;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #008300;
    --series-7: #9085e9;
    --series-8: #e66767;
    --series-other: #5c5b57;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface-1: #1a1a19;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.05);
  --accent: #3987e5;
  --series-1: #3987e5;
  --series-2: #d95926;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #008300;
  --series-7: #9085e9;
  --series-8: #e66767;
  --series-other: #5c5b57;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
#app { max-width: 1400px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0; }
h2 { margin: 0; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; margin: 4px 0; }
.page-header { position: sticky; top: 0; z-index: 5; background: var(--page); padding: 8px 0 12px; }
.title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.segmented { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
.segmented-label { padding: 0 8px; color: var(--text-muted); font-size: 12px; }
.segment { border: 0; background: transparent; color: var(--text-secondary); padding: 6px 10px; font: inherit; cursor: pointer; }
.segment:hover { background: var(--wash); }
.segment.is-active { color: var(--text-primary); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 999px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.chip:hover { background: var(--wash); }
.button { border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
.button:hover { background: var(--wash); }
.link-button { border: 0; background: transparent; color: var(--accent); font: inherit; font-size: 12px; cursor: pointer; padding: 4px; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; transition: opacity 120ms; }
.grid.is-refreshing { opacity: 0.55; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; scroll-margin-top: 120px; }
.span-full, .findings { grid-column: 1 / -1; }
.card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.card-title { font-size: 15px; font-weight: 600; }
.card-subtitle { margin: 2px 0 0; color: var(--text-muted); font-size: 12px; }
.card-body { min-width: 0; }
.chart-svg { display: block; width: 100%; height: auto; overflow: visible; user-select: none; }
.chart-svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
.tick { fill: var(--text-muted); font-variant-numeric: tabular-nums; }
.grid-line { stroke: var(--grid); stroke-width: 1; }
.axis-line { stroke: var(--axis); stroke-width: 1; }
.hit-layer { fill: transparent; cursor: crosshair; }
.hover-band { fill: var(--wash); }
.selected-band { fill: var(--wash); }
.brush { fill: var(--accent); fill-opacity: 0.12; stroke: var(--accent); stroke-width: 1; }
.crosshair { stroke: var(--axis); stroke-width: 1; }
.series-line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.end-dot { stroke: var(--surface-1); stroke-width: 2; }
.bar-row { cursor: pointer; }
.bar-row .row-hit { fill: transparent; }
.bar-row:hover .row-hit, .bar-row:focus .row-hit { fill: var(--wash); }
.row-label { fill: var(--text-secondary); }
.row-value { fill: var(--text-primary); font-variant-numeric: tabular-nums; }
.dot { cursor: pointer; }
.dot-hit { fill: transparent; }
.dot-measured { stroke: var(--surface-1); stroke-width: 2; }
.dot-estimated { fill: var(--surface-1); stroke-width: 2; }
.dot:hover .dot-measured, .dot:focus .dot-measured { stroke: var(--text-primary); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 8px; font-size: 12px; color: var(--text-secondary); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: inherit; font: inherit; padding: 0; }
button.legend-item { cursor: pointer; }
.legend-item.is-muted { opacity: 0.45; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--swatch); }
.swatch-line { height: 2px; width: 14px; border-radius: 1px; }
.swatch-dot { border-radius: 50%; }
.swatch-ring { border-radius: 50%; background: transparent; border: 2px solid var(--swatch); }
.swatch-hatch, .tooltip-key-hatch { background: repeating-linear-gradient(135deg, var(--swatch) 0 2px, var(--surface-1) 2px 4px); }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.stat-tile { padding: 4px 0; }
.stat-label { color: var(--text-secondary); font-size: 12px; }
.stat-value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
.stat-note { color: var(--text-muted); font-size: 12px; }
.finding-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 10px; }
.finding { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.finding-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.finding-subject { color: var(--text-secondary); overflow-wrap: anywhere; }
.finding-metric { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; }
.finding-advice { margin: 0; color: var(--text-secondary); font-size: 13px; }
.finding-actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.finding-actions .button:only-child { margin-right: auto; }
.finding-count { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.group-impact { margin-left: auto; font-variant-numeric: tabular-nums; }
.group-table { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; column-gap: 10px; }
.group-columns, .group-rows, .group-row { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: baseline; }
.group-columns { font-size: 11px; border-bottom: 1px solid var(--axis); padding-bottom: 3px; }
.group-columns .group-value { white-space: normal; max-width: 16ch; align-self: end; }
.group-rows { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.group-row { border-bottom: 1px solid var(--grid); padding: 2px 0; }
.group-row:last-child { border-bottom: 0; }
.group-row:hover { background: var(--wash); }
.group-subject { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
.group-value { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.group-row .link-button { text-align: right; }
.impact { color: var(--text-primary); }
.severity-badge { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }
.severity-badge::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.severity-badge.severity-high::before { background: var(--status-critical); }
.severity-badge.severity-medium::before { background: var(--status-serious); }
.severity-badge.severity-low::before { background: var(--status-warning); }
.basis { font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--text-secondary); }
.basis-estimated { background: repeating-linear-gradient(135deg, var(--wash) 0 3px, transparent 3px 6px); }
.table-scroll { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table th { text-align: left; font-weight: 600; color: var(--text-secondary); border-bottom: 1px solid var(--axis); padding: 6px 8px; white-space: nowrap; }
.data-table td { border-bottom: 1px solid var(--grid); padding: 6px 8px; font-variant-numeric: tabular-nums; vertical-align: top; }
.data-table .num { text-align: right; white-space: nowrap; }
.sessions-table tbody tr { cursor: pointer; }
.sessions-table tbody tr:hover { background: var(--wash); }
.sessions-table tr.is-selected { box-shadow: inset 3px 0 0 var(--accent); background: var(--wash); }
.title-cell { max-width: 280px; overflow-wrap: anywhere; }
.status::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--text-muted); }
.status-ok::before { background: var(--status-good); }
.status-failed::before { background: var(--status-critical); }
.sources-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; flex-wrap: wrap; }
.tooltip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); font-size: 12px; max-width: 320px; }
.tooltip-title { color: var(--text-secondary); margin-bottom: 4px; }
.tooltip-row { display: grid; grid-template-columns: auto 14px 1fr; gap: 6px; align-items: center; }
.tooltip-value { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.tooltip-key { width: 12px; height: 2px; background: var(--swatch); }
.tooltip-key-hatch { height: 8px; }
.tooltip-key.is-empty { background: transparent; }
.tooltip-label { color: var(--text-secondary); }
.status-message { padding: 40px 0; color: var(--text-secondary); }
.status-message pre { white-space: pre-wrap; }
@media (max-width: 860px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .page-header { position: static; }
}
@media (forced-colors: active) {
  .swatch, .tooltip-key { forced-color-adjust: none; }
}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { boot } from '/web/app.ts';
boot(document.getElementById('app'));
</script>
</body>
</html>
